<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>ojakgyo · chat</title>
  <style>
    :root { --font: 'Pretendard Variable', Pretendard, system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; overflow: hidden; height: 100vh; font-family: var(--font); }
    body.preview { background: repeating-conic-gradient(#2a2a2e 0% 25%, #222226 0% 50%) 50% / 24px 24px; }
    #chat { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; max-height: 100vh; }
    .line {
      align-self: flex-start; max-width: 100%; padding: 6px 11px 7px; border-radius: 6px;
      background: rgba(16, 17, 19, 0.78); color: #ececef; font-size: 19px; line-height: 1.4; word-break: break-word;
      animation: in 180ms ease-out both;
    }
    .line.out { animation: out 400ms ease-in forwards; }
    .line .nick { font-weight: 700; margin-right: 7px; }
    .line .role { font-size: 12px; font-weight: 600; color: #c9c9cf; border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 3px; padding: 0 4px; margin-right: 6px; vertical-align: 2px; }
    .line.donation, .line.subscription { box-shadow: inset 3px 0 0 var(--accent); padding-left: 13px; }
    .line.donation { --accent: #e8a33d; }
    .line.subscription { --accent: #5b9cf0; }
    .line .tag { color: var(--accent); font-weight: 700; margin-right: 7px; font-variant-numeric: tabular-nums; }
    .line .emoji { height: 1.35em; vertical-align: -0.3em; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } }
    @keyframes out { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .line, .line.out { animation-duration: 1ms; } }
  </style>
</head>
<body>
  <div id="chat"></div>
  <script type="module">
    import { connect, el, richText, won, nickColor } from '/assets/client.js';

    // ?fade=45 seconds before a line fades (0 keeps lines)  ?max=30 lines  ?preview=1 checkerboard
    const params = new URLSearchParams(location.search);
    if (params.has('preview')) document.body.classList.add('preview');
    const fadeAfter = Number(params.get('fade') ?? 45) * 1000;
    const maxLines = Number(params.get('max') ?? 30);
    const root = document.getElementById('chat');
    const ROLE = { streamer: '스트리머', manager: '매니저', chat_manager: '매니저' };

    function add(event, receivedAt = Date.now()) {
      const line = el('div', `line ${event.type}`);
      const name = event.user?.nickname ?? '익명의 후원자';
      const role = event.user && ROLE[event.user.role];
      if (role) line.append(el('span', 'role', role));
      const nick = el('span', 'nick', name);
      nick.style.color = nickColor(name);
      line.append(nick);
      if (event.type === 'donation') line.append(el('span', 'tag', `후원 ${won(event.amount)}원`));
      if (event.type === 'subscription') line.append(el('span', 'tag', `구독 ${event.months}개월`));
      richText(line, event.message, event.emojis);
      root.append(line);
      while (root.children.length > maxLines) root.firstElementChild.remove();
      const remaining = fadeAfter - (Date.now() - receivedAt);
      if (fadeAfter > 0) setTimeout(() => { line.classList.add('out'); setTimeout(() => line.remove(), 420); }, Math.max(0, remaining));
    }

    // Restore recent lines so refreshing the OBS source doesn't wipe the chat.
    const seen = new Set();
    fetch('/api/state').then((r) => r.json()).then((state) => {
      const cutoff = fadeAfter > 0 ? Date.now() - fadeAfter : 0;
      for (const e of state.events.slice(-maxLines)) {
        if (e.receivedAt >= cutoff && !seen.has(e.id)) { seen.add(e.id); add(e, e.receivedAt); }
      }
    }).catch(() => {});

    connect('chat', (msg) => {
      if (msg.kind === 'event' && !seen.has(msg.event.id)) { seen.add(msg.event.id); add(msg.event); }
    });
  </script>
</body>
</html>
