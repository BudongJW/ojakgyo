<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>ojakgyo · chat</title>
  <link rel="stylesheet" href="/assets/ojakgyo.css" />
  <style>
    html, body { background: transparent; overflow: hidden; height: 100vh; }
    body.preview { background: repeating-conic-gradient(#20233a 0% 25%, #191b2e 0% 50%) 50% / 32px 32px; }
    #chat { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; max-height: 100vh; }
    .line { align-self: flex-start; max-width: 100%; padding: 9px 14px 10px; border-radius: 16px 16px 16px 6px; background: rgba(12, 15, 42, 0.78); border: 1px solid rgba(160, 170, 255, 0.16); font-size: 20px; line-height: 1.4; color: #f1f2ff; word-break: break-word; animation: in 0.35s cubic-bezier(.2, 1.3, .4, 1) both; backdrop-filter: blur(6px); }
    .line.out { animation: out 0.6s ease-in forwards; }
    .line .nick { font-weight: 800; margin-right: 8px; }
    .line .role { font-size: 12px; font-weight: 800; padding: 1px 6px; border-radius: 6px; margin-right: 6px; vertical-align: 2px; background: #ffd27a; color: #2a1d00; }
    .line .role.manager, .line .role.chat_manager { background: #7ad7ff; color: #00222f; }
    .line.donation { background: linear-gradient(100deg, rgba(255, 122, 198, 0.42), rgba(12, 15, 42, 0.85)); border-color: rgba(255, 122, 198, 0.6); }
    .line.subscription { background: linear-gradient(100deg, rgba(122, 215, 255, 0.4), rgba(12, 15, 42, 0.85)); border-color: rgba(122, 215, 255, 0.6); }
    .line .amt { color: #ffd27a; font-weight: 800; margin-right: 6px; }
    .line .emoji { height: 1.4em; vertical-align: -0.3em; }
    @keyframes in { from { opacity: 0; transform: translateX(-24px); } }
    @keyframes out { to { opacity: 0; transform: translateX(-16px); } }
  </style>
</head>
<body>
  <div id="chat"></div>
  <script type="module">
    import { connect, el, richText, won, nickColor } from '/assets/client.js';

    const params = new URLSearchParams(location.search);
    if (params.has('preview')) document.body.classList.add('preview');
    const fadeAfter = Number(params.get('fade') ?? 45) * 1000; // 0 keeps lines forever
    const maxLines = Number(params.get('max') ?? 30);
    const root = document.getElementById('chat');

    function add(event, receivedAt = Date.now()) {
      const line = el('div', `line ${event.type}`);
      const name = event.user?.nickname ?? '익명의 후원자';
      if (event.user && ['streamer', 'manager', 'chat_manager'].includes(event.user.role)) {
        line.append(el('span', `role ${event.user.role}`, event.user.role === 'streamer' ? '주인장' : '매니저'));
      }
      const nick = el('span', 'nick', name);
      nick.style.color = nickColor(name);
      line.append(nick);
      if (event.type === 'donation') line.append(el('span', 'amt', `💝 ${won(event.amount)}원`));
      if (event.type === 'subscription') line.append(el('span', 'amt', `⭐ ${event.months}개월 구독`));
      richText(line, event.message, event.emojis);
      root.append(line);
      while (root.children.length > maxLines) root.firstElementChild.remove();
      const remaining = fadeAfter - (Date.now() - receivedAt);
      if (fadeAfter > 0) setTimeout(() => { line.classList.add('out'); setTimeout(() => line.remove(), 650); }, Math.max(0, remaining));
    }

    // Restore recent lines so refreshing the OBS source doesn't wipe the chat.
    const seen = new Set();
    fetch('/api/state').then((r) => r.json()).then((state) => {
      const cutoff = fadeAfter > 0 ? Date.now() - fadeAfter : 0;
      for (const e of state.events.slice(-maxLines)) {
        if (e.receivedAt >= cutoff && !seen.has(e.id)) { seen.add(e.id); add(e, e.receivedAt); }
      }
    }).catch(() => {});

    connect('chat', (msg) => {
      if (msg.kind === 'event' && !seen.has(msg.event.id)) { seen.add(msg.event.id); add(msg.event); }
    });
  </script>
</body>
</html>
