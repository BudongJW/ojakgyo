<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ojakgyo · face tracker</title>
  <link rel="icon" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/assets/ojakgyo.css" />
  <style>
    .tracker { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
    .stage { position: relative; background: #000; border-radius: var(--radius); overflow: hidden; aspect-ratio: 4 / 3; }
    .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .stage.mirror video, .stage.mirror canvas { transform: scaleX(-1); }
    .stage .idle { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-3); text-align: center; padding: 20px; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .row label { color: var(--text-2); font-size: 12px; min-width: 64px; }
    .row select { flex: 1; }
    .meter { display: grid; grid-template-columns: 96px 1fr 40px; gap: 8px; align-items: center; font-size: 12px; margin: 6px 0; }
    .meter span:first-child { color: var(--text-2); }
    .meter .bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
    .meter .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
    .meter .val { text-align: right; color: var(--text-3); font: 11px var(--mono); }
    .state { font-size: 12px; color: var(--text-2); margin: 8px 0 0; }
    .state b { color: var(--text); font-weight: 600; }
    @media (max-width: 900px) { .tracker { grid-template-columns: 1fr; } }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/build/three.module.js",
      "@mediapipe/tasks-vision": "/vendor/mediapipe/vision_bundle.mjs"
    }
  }
  </script>
</head>
<body class="dash">
  <div class="wrap">
    <header class="topbar">
      <a class="name" href="/" style="color: inherit; text-decoration: none">ojakgyo</a>
      <span class="ver" data-i18n="tracker.title">Face tracker</span>
      <span class="host" id="host"></span>
    </header>

    <div class="tracker">
      <div class="stage mirror" id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="dots"></canvas>
        <div class="idle" id="idle" data-i18n="tracker.idle">Press Start and allow camera access. Your avatar overlay will follow your face.</div>
      </div>

      <div>
        <section class="panel">
          <div class="panel-head"><h2 data-i18n="tracker.controls">Camera</h2></div>
          <div class="panel-body">
            <div class="row">
              <label for="camera" data-i18n="tracker.camera">Camera</label>
              <select class="input" id="camera"></select>
            </div>
            <div class="row">
              <label for="mirror" data-i18n="tracker.mirror">Mirror</label>
              <input type="checkbox" id="mirror" checked />
            </div>
            <button class="btn primary" id="toggle" type="button" data-i18n="tracker.start">Start</button>
            <p class="state" id="state"></p>
            <div class="row" style="margin: 14px 0 0">
              <button class="btn secondary" id="calibrate" type="button" data-i18n="tracker.calibrate">Set neutral pose</button>
              <button class="btn secondary" id="reset" type="button" data-i18n="tracker.reset">Reset</button>
            </div>
            <p class="hint" data-i18n="tracker.calibrateHint">If the avatar leans while you sit still, look straight at the screen and set the neutral pose.</p>
            <p class="hint" style="margin-top: 10px" data-i18n="tracker.hint">Keep this window open and visible while streaming; browsers pause hidden tabs.</p>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2 data-i18n="tracker.signals">Signals</h2></div>
          <div class="panel-body" id="meters"></div>
        </section>
      </div>
    </div>
  </div>
  <script type="module" src="/assets/tracker.js"></script>
</body>
</html>
