<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>ojakgyo · alerts</title>
  <style>
    :root {
      --font: 'Pretendard Variable', Pretendard, system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      --accent: #e8a33d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; overflow: hidden; width: 100vw; height: 100vh; font-family: var(--font); }
    body.preview { background: repeating-conic-gradient(#2a2a2e 0% 25%, #222226 0% 50%) 50% / 24px 24px; }

    .stage { position: fixed; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; padding: 0 4vw; }
    .stage.top { top: 6vh; }
    .stage.center { top: 50%; transform: translateY(-50%); }
    .stage.bottom { bottom: 8vh; }

    .alert {
      position: relative; display: grid; grid-template-columns: 6px auto; min-width: 460px; max-width: 72vw;
      background: rgba(16, 17, 19, 0.94); color: #f2f2f4; border-radius: 8px; overflow: hidden;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset, 0 12px 32px rgba(0, 0, 0, 0.35);
      animation: enter 260ms cubic-bezier(.2, .7, .2, 1) both;
    }
    .alert.subscription { --accent: #5b9cf0; }
    .alert.out { animation: leave 220ms ease-in both; }
    .alert .bar-side { background: var(--accent); }
    .alert .body { padding: 18px 26px 20px 22px; }
    .alert .kicker { font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: 0.02em; }
    .alert img.art { display: block; max-height: 160px; max-width: 280px; margin: 6px 0 10px; border-radius: 4px; }
    .alert .title { margin-top: 2px; font-size: 34px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    .alert .message { margin-top: 6px; font-size: 23px; line-height: 1.4; color: #c9c9cf; word-break: break-word; }
    .alert .message .emoji { height: 1.25em; vertical-align: -0.25em; }
    .alert .timer { position: absolute; left: 6px; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, 0.08); }
    .alert .timer i { display: block; height: 100%; background: var(--accent); opacity: 0.7; transform-origin: left; }

    .sound-gate { position: fixed; right: 16px; bottom: 16px; font: 600 13px var(--font); color: #fff; background: rgba(0, 0, 0, .7); padding: 8px 12px; border-radius: 6px; cursor: pointer; pointer-events: auto; border: 0; }
    @keyframes enter { from { opacity: 0; transform: translateY(-12px); } }
    @keyframes leave { to { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .alert, .alert.out { animation-duration: 1ms; } }
  </style>
</head>
<body>
  <div class="stage top" id="stage"></div>
  <script type="module" src="/assets/overlay-alerts.js"></script>
</body>
</html>
