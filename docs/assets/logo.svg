<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ojakgyo logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2160"/>
      <stop offset="1" stop-color="#0a0d26"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ac6"/>
      <stop offset="0.5" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#7ad7ff"/>
    </linearGradient>
    <radialGradient id="glowL"><stop offset="0" stop-color="#ff7ac6" stop-opacity="0.9"/><stop offset="1" stop-color="#ff7ac6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowR"><stop offset="0" stop-color="#7ad7ff" stop-opacity="0.9"/><stop offset="1" stop-color="#7ad7ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <g fill="#fff" opacity="0.55">
    <circle cx="30" cy="26" r="1.2"/><circle cx="96" cy="20" r="1"/><circle cx="64" cy="16" r="1.4"/>
    <circle cx="108" cy="46" r="0.9"/><circle cx="18" cy="52" r="0.9"/><circle cx="80" cy="34" r="0.8"/>
  </g>
  <!-- the magpie bridge: an arc of little birds -->
  <path d="M22 86 Q64 30 106 86" fill="none" stroke="url(#arc)" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <g fill="url(#arc)">
    <path d="M30 76 l6 -3 l-1.5 4.5 l4.5 1 l-6 2.5 z"/>
    <path d="M40 64 l6 -3 l-1.5 4.5 l4.5 1 l-6 2.5 z"/>
    <path d="M52 56 l6 -3 l-1.5 4.5 l4.5 1 l-6 2.5 z"/>
    <path d="M64 53 l6 -3 l-1.5 4.5 l4.5 1 l-6 2.5 z"/>
    <path d="M76 56 l6 -3 l-1.5 4.5 l4.5 1 l-6 2.5 z"/>
    <path d="M87 64 l6 -3 l-1.5 4.5 l4.5 1 l-6 2.5 z"/>
    <path d="M96 76 l6 -3 l-1.5 4.5 l4.5 1 l-6 2.5 z"/>
  </g>
  <!-- the two stars at each end of the bridge -->
  <circle cx="22" cy="92" r="14" fill="url(#glowL)"/>
  <circle cx="106" cy="92" r="14" fill="url(#glowR)"/>
  <path d="M22 84 l2.4 5.6 l5.6 2.4 l-5.6 2.4 l-2.4 5.6 l-2.4 -5.6 l-5.6 -2.4 l5.6 -2.4 z" fill="#ffe1f2"/>
  <path d="M106 84 l2.4 5.6 l5.6 2.4 l-5.6 2.4 l-2.4 5.6 l-2.4 -5.6 l-5.6 -2.4 l5.6 -2.4 z" fill="#e3f7ff"/>
</svg>
